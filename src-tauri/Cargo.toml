[package]
name = "better-notepad"
version = "0.1.0"
description = "Schema-driven Markdown notepad with private Drive sync"
authors = ["Better Notepad"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "better_notepad_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-appender = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
url = "2"
urlencoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "multipart"] }
open = "5"
tiny_http = "0.12"
keyring = { version = "3", default-features = false, features = ["windows-native"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
parking_lot = "0.12"
percent-encoding = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
